<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>团队成员 — 团队作业的博客 / Team Members</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>">
  <meta name="description" content="Meet the team members behind the projects.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>

  <!-- Dynamic Interaction Background -->
  <canvas class="landing-canvas" id="landing-canvas"></canvas>

  <!-- Ambient Light Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <!-- Header Navigation -->
  <header class="landing-header">
    <div class="brand">
      <span class="brand-logo">🚀</span>
      <span class="brand-title" data-i18n="nav.title">团队作业的博客</span>
    </div>
    
    <nav class="nav-links">
      <a href="landing.html" class="nav-link" data-i18n="nav.intro">介绍页</a>
      <a href="team.html" class="nav-link active" data-i18n="nav.team">团队成员</a>
      <a href="homework.html" class="nav-link" data-i18n="nav.homework">平时作业</a>
      <a href="project.html" class="nav-link" data-i18n="nav.project">最终项目</a>
    </nav>

    <div class="header-actions">
      <!-- Admin Workspace Entry -->
      <a href="app.html" class="nav-workspace-btn" id="header-workspace-btn" title="Admin Workspace">
        <span>📝</span>
        <span data-i18n="landing.header.workspace">协作后台</span>
      </a>
      <!-- Theme Switch Button -->
      <button class="icon-btn" id="theme-toggle-btn" title="Toggle Theme">
        <span id="theme-icon">🌙</span>
      </button>
      <!-- Language Selection -->
      <button class="lang-toggle-btn" id="lang-toggle-btn">
        <span class="lang-icon">🌐</span>
        <span id="lang-label">English / 中文</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="landing-container">
    
    <!-- Section Title -->
    <section class="hero-section" style="padding-bottom: 0;">
      <h1 class="hero-title-shimmer" data-i18n="landing.section.team">项目构建成员 / Team Members</h1>
      <p class="hero-subtitle" data-i18n="landing.team.desc">感谢为团队作业展示项目付出心血的小组成员：</p>
    </section>

    <!-- Team Members Grid -->
    <section class="portal-section" style="margin-top: 0; padding-top: 0;">
      <div class="team-showcase-grid" id="team-showcase-grid" style="margin-top: 20px;">
        <!-- Loaded dynamically from content.json -->
        <div class="loading-placeholder">Loading team members...</div>
      </div>
    </section>

    <!-- Page Footer -->
    <footer class="landing-footer">
      <p class="footer-text">Made by ZWU-2026-2-005 2026</p>
    </footer>
  </div>

  <script type="module" src="js/team.js"></script>
</body>
</html>
